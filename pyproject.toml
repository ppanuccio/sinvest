[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sinvest"
version = "0.1.0"
description = "Investment Portfolio Management Application"
authors = [{name = "Principal Architect", email = "dev@sinvest.local"}]
license = "MIT"
readme = "README.md"
python = "^3.10"

[tool.poetry]
name = "sinvest"
version = "0.1.0"
description = "Investment Portfolio Management Application"
authors = ["Principal Architect <dev@sinvest.local>"]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
python-dateutil = "^2.8"
email-validator = "^2.0"
fastapi = "^0.111.1"
uvicorn = "^0.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-asyncio = "^0.21"
black = "^23.7"
flake8 = "^6.1"
mypy = "^1.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
