[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinvest"
version = "0.1.0"
description = "Investment Portfolio Management Application"
authors = [{name = "Principal Architect", email = "dev@sinvest.local"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3",
    "python-dateutil>=2.8,<3",
    "email-validator>=2.0,<3",
    "fastapi>=0.111.1,<1",
    "uvicorn>=0.24.0,<1",
    "httpx>=0.27.0,<1",
    "yfinance>=1.5,<2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "pytest-asyncio>=0.23,<0.24",
    "black>=23.7,<24",
    "flake8>=6.1,<7",
    "mypy>=1.5,<2",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
